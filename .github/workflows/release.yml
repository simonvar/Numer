name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Verify APK was built
      run: |
        if [ ! -f app/build/outputs/apk/release/*.apk ]; then
          echo "No APK found in release directory"
          ls -la app/build/outputs/apk/release/ || echo "Release directory does not exist"
          exit 1
        fi
      
    - name: Get APK path
      id: apk-path
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
        echo "APK found at: $APK_PATH"
        echo "path=$APK_PATH" >> $GITHUB_OUTPUT
        
    - name: Get version name
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle | sed 's/.*versionName "\(.*\)".*/\1/')
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        
    - name: Upload APK to existing Release
      if: github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ github.event.release.tag_name }} "${{ steps.apk-path.outputs.path }}" --clobber
        
    - name: Create Release and Upload APK (for tag pushes)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          --title "Release ${{ github.ref_name }}" \
          --notes "Automatic release for version ${{ github.ref_name }}

        ## Changes
        - Android APK build for release" \
          "${{ steps.apk-path.outputs.path }}#Numer-${{ steps.version.outputs.name }}.apk"
        
    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Numer-APK-${{ steps.version.outputs.name }}
        path: ${{ steps.apk-path.outputs.path }}
        retention-days: 30